name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    # The same check as hacs/default: the latest hassfest image, and a brand warning fails the job.
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: hassfest validation
        run: |
          set -o pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE/custom_components/family_hub":/github/workspace/custom_components/family_hub \
            ghcr.io/home-assistant/hassfest:latest | tee /tmp/hassfest.log
          if grep -F "[WARNING] [BRAND_IMAGES]" /tmp/hassfest.log; then
            exit 1
          fi
